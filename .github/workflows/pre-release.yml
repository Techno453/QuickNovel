# Rolling pre-release: after CI passes on master, rebuild the debug APK and replace the
# 'pre-release' GitHub release with it. Debug builds' in-app updater follows this release
# (asset QuickNovel-<versionName>-pre.<run>.apk, ordered by this workflow's run number).
# See docs/ci.md.
name: Pre-release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pre-release
  cancel-in-progress: true

jobs:
  pre-release:
    # Only for green CI runs of pushes to master (not pull requests), or a manual run.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      # Baked into BuildConfig.CI_BUILD_NUMBER; must only grow, so always this workflow's counter.
      QN_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The action's default package list includes the long-gone "tools" package, which makes
      # sdkmanager fail; platform-tools is all it needs to install. AGP downloads the compileSdk
      # platform and build-tools itself once the licences are accepted.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4

      # Sign with the release key when it is configured so successive pre-releases install over
      # each other; without it every runner has its own debug key and each pre-release must be
      # installed fresh (the app explains this instead of failing in the installer).
      - name: Decode signing keystore
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGN_DEBUG_WITH_RELEASE_KEY=true" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No KEYSTORE_BASE64 secret: the pre-release is signed with this runner's debug key."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build debug APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Collect APK and notes
        id: apk
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          name=$(sed -n 's/^[[:space:]]*versionName "\(.*\)"[[:space:]]*$/\1/p' app/build.gradle | head -n 1)
          file="QuickNovel-$name-pre.$QN_BUILD_NUMBER.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$file"
          rm -f "$RUNNER_TEMP/release.jks"
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "label=$name-pre.$QN_BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          {
            echo "Automatic debug build of master at ${SHA::7} (pre-release build $QN_BUILD_NUMBER)."
            echo
            echo "Installs as a separate app (\`com.lagradost.quicknovel.debug\`) next to the release app."
            echo "Its in-app updater follows this pre-release; release builds ignore it."
            if [ "$SIGNED" != "true" ]; then
              echo
              echo "> Signed with a throwaway debug key (no release signing secrets configured): it cannot"
              echo "> update an earlier pre-release install. See docs/ci.md."
            fi
            echo
            echo "Changes: https://github.com/$GITHUB_REPOSITORY/commits/$SHA"
          } > notes.md

      - name: Replace the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          FILE: ${{ steps.apk.outputs.file }}
          LABEL: ${{ steps.apk.outputs.label }}
        run: |
          gh release delete pre-release --cleanup-tag --yes || true
          gh release create pre-release "$FILE" --target "$SHA" --prerelease \
            --title "Pre-release $LABEL" --notes-file notes.md
