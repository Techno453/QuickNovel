# Builds the release APKs (one per ABI plus a universal one) for a version tag and publishes a
# GitHub release with them and R8's mapping.txt attached.
# The in-app updater of release builds reads this release (releases/latest). See docs/ci.md.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, e.g. v3.8.1 (must be v + versionName; created on this commit if missing)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches versionName
        id: version
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          name=$(sed -n 's/^[[:space:]]*versionName "\(.*\)"[[:space:]]*$/\1/p' app/build.gradle | head -n 1)
          code=$(sed -n 's/^[[:space:]]*versionCode \([0-9]*\)[[:space:]]*$/\1/p' app/build.gradle | head -n 1)
          if [ -z "$name" ] || [ -z "$code" ]; then
            echo "::error::Could not read versionName / versionCode from app/build.gradle"; exit 1
          fi
          if [ "$TAG" != "v$name" ]; then
            echo "::error::Tag $TAG does not match versionName $name in app/build.gradle (expected v$name). Bump the version first (docs/ci.md)."
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
      - name: Install Android platform (compileSdk 37)
        run: sdkmanager --install "platforms;android-37.0"

      - uses: gradle/actions/setup-gradle@v4

      # The keystore comes from the KEYSTORE_BASE64 secret; app/build.gradle reads KEYSTORE_FILE,
      # KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD from the environment.
      - name: Decode signing keystore
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No KEYSTORE_BASE64 secret: the release APK is signed with a throwaway debug key (see docs/ci.md)."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Unit tests and release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease --stacktrace

      # app/build.gradle splits the release build per ABI: app-<abi>-release.apk for arm64-v8a,
      # armeabi-v7a and x86_64, plus app-universal-release.apk. They are published as
      # QuickNovel-<version>-<abi>.apk / -universal.apk (the in-app updater picks by these
      # suffixes), with R8's mapping.txt as QuickNovel-<version>-mapping.txt.gz for crash traces.
      - name: Collect APKs, mapping and notes
        env:
          NAME: ${{ steps.version.outputs.name }}
          CODE: ${{ steps.version.outputs.code }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          out=app/build/outputs/apk/release
          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a x86_64 universal; do
            src="$out/app-$abi-release.apk"
            if [ ! -f "$src" ]; then
              echo "::error::Missing $src"; ls -l "$out"; exit 1
            fi
            cp "$src" "dist/QuickNovel-$NAME-$abi.apk"
          done
          # ~100 MB as text, ~8 MB gzipped.
          gzip -9 -c app/build/outputs/mapping/release/mapping.txt > "dist/QuickNovel-$NAME-mapping.txt.gz"
          ls -l dist
          rm -f "$RUNNER_TEMP/release.jks"
          {
            echo "QuickNovel $NAME (versionCode $CODE), built from ${GITHUB_SHA::7}."
            echo
            echo "Which APK: \`arm64-v8a\` for almost every phone and tablet from the last years,"
            echo "\`armeabi-v7a\` for old 32-bit phones, \`x86_64\` for emulators and Intel/AMD Chromebooks,"
            echo "\`universal\` if unsure (larger; works everywhere). The in-app updater picks automatically."
            echo
            if [ "$SIGNED" != "true" ]; then
              echo "> **Debug-signed build.** The repository has no release signing secrets yet, so this APK"
              echo "> is signed with a throwaway debug key: it installs as a fresh app but cannot update an"
              echo "> earlier install, and later releases cannot update it. See docs/ci.md to add a release key."
              echo
            fi
          } > notes.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          NAME: ${{ steps.version.outputs.name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            # A re-run over a release from before the per-ABI split: drop its single APK.
            gh release delete-asset "$TAG" "QuickNovel-$NAME.apk" --yes 2> /dev/null || true
            gh release edit "$TAG" --title "QuickNovel $NAME" --notes-file notes.md
          else
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" \
              --title "QuickNovel $NAME" --notes-file notes.md --generate-notes --latest
          fi
