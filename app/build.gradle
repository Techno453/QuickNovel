// Translation benchmark (app/src/test/.../bench/TranslationBench, docs/translation-bench.md) and
// the live provider smoke test (providers/CjkProvidersLiveSmokeTest, docs/ci.md): forward
// -Dbench / -Dbench.* / -Dlive / -Dlive.* to the test JVM, never treat such a run as up to date,
// and show its console output. Without BENCH=1 / -Dbench=1 (LIVE=1 / -Dlive=1) those tests skip.
tasks.withType(Test).configureEach {
    System.properties.each { k, v ->
        def key = k.toString()
        if (key == 'bench' || key.startsWith('bench.') || key == 'live' || key.startsWith('live.')) {
            systemProperty key, v.toString()
        }
    }
    // Live provider tests (src/test/.../providers/cjk, docs/sources.md): -Dlive=1 or LIVE=1.
    if (System.getenv('LIVE') != null) systemProperty 'live', System.getenv('LIVE')
    // Live OpenAI Batch API test (src/test/.../bench/BatchLiveTest): -Dlive.batch=1 or LIVE_BATCH=1.
    if (System.getenv('LIVE_BATCH') != null) systemProperty 'live.batch', System.getenv('LIVE_BATCH')
    if (System.getProperty('bench') != null || System.getenv('BENCH') != null ||
            System.getProperty('live') != null || System.getenv('LIVE') != null ||
            System.getProperty('live.batch') != null || System.getenv('LIVE_BATCH') != null) {
        outputs.upToDateWhen { false }
        testLogging.showStandardStreams = true
    }
}
