plugins {
    alias(libs.plugins.compose.compiler)
}
apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'
apply plugin: 'com.google.devtools.ksp'

apply(plugin: "org.jetbrains.kotlin.plugin.compose")

android {
    compileSdkVersion 37
    //buildToolsVersion "30.0.3"

    dependenciesInfo {
        // Disables dependency metadata when building APKs.
        includeInApk = false
        // Disables dependency metadata when building Android App Bundles.
        includeInBundle = false
    }

    viewBinding {
        enabled = true
    }

    defaultConfig {
        applicationId "com.lagradost.quicknovel"
        minSdkVersion 23
        targetSdkVersion 37
        versionCode 57
        versionName "3.9.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // GitHub Actions run number of a CI build (0 for local builds); the in-app updater uses it
        // to order builds on the rolling pre-release channel. See docs/ci.md.
        buildConfigField("int", "CI_BUILD_NUMBER", (System.getenv("QN_BUILD_NUMBER") ?: "0").toInteger().toString())
    }

    // Release signing comes from the environment (GitHub secrets in .github/workflows, see
    // docs/ci.md); nothing is read from local files. Without KEYSTORE_FILE the release build is
    // signed with the debug key so assembleRelease always produces an installable APK.
    def releaseKeystore = System.getenv("KEYSTORE_FILE")
    signingConfigs {
        if (releaseKeystore) {
            release {
                storeFile file(releaseKeystore)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            signingConfig releaseKeystore ? signingConfigs.release : signingConfigs.debug
            // R8 shrinks, optimizes and obfuscates the code and drops unused resources. Keep
            // rules (Jackson models, reflection) are in proguard-rules.pro; the mapping file for
            // crash traces is app/build/outputs/mapping/release/mapping.txt (docs/ci.md).
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // The pre-release workflow signs debug builds with the release key so successive
            // pre-releases install over each other (every CI runner has a different debug key).
            if (releaseKeystore && System.getenv("SIGN_DEBUG_WITH_RELEASE_KEY") == "true") {
                signingConfig signingConfigs.release
            }
            buildConfigField("boolean", "BETA", "true")
            applicationIdSuffix ".debug"
            versionNameSuffix '-DEBUG'
            debuggable true
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Release: one APK per ABI (most of an APK is ML Kit's libtranslate_jni.so, 11-17 MB per
    // ABI) plus a universal APK; the in-app updater picks the one for the device (docs/ci.md).
    // x86_64 is for emulators. Debug builds stay a single universal app-debug.apk, see
    // androidComponents below.
    splits {
        abi {
            enable true
            reset()
            include "arm64-v8a", "armeabi-v7a", "x86_64"
            universalApk true
        }
    }

    packaging {
        resources {
            // BouncyCastle (pulled in by pdfbox-android for certificate-encrypted PDFs) ships
            // ~8 MB of post-quantum (Picnic, SIKE) parameter tables as Java resources, which R8
            // does not shrink. Nothing in the app or pdfbox uses post-quantum crypto.
            excludes += ["org/bouncycastle/pqc/**"]
        }
    }

    buildFeatures.buildConfig true
    buildFeatures.compose true

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11.toString()
        freeCompilerArgs = ['-XXLanguage:+PropertyParamAnnotationDefaultTargetMode']
    }
    namespace 'com.lagradost.quicknovel'
}

// `splits` applies to every build type. Debug builds (CI artifact, pre-release, emulator
// installs) keep today's single universal APK at app/build/outputs/apk/debug/app-debug.apk:
// drop their per-ABI outputs and give the universal one its usual name (outputFileName is only
// exposed by AGP's VariantOutputImpl).
androidComponents {
    onVariants(selector().withBuildType("debug")) { variant ->
        variant.outputs.each { output ->
            if (output.filters.any { it.filterType.name() == "ABI" }) {
                output.enabled.set(false)
            } else {
                output.outputFileName.set("app-debug.apk")
            }
        }
    }
}

